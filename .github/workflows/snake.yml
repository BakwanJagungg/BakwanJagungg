name: Generate Snake Animation

on:
  schedule:
    # Berjalan otomatis setiap 24 jam (jam 00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk@v3
        with:
          github_user_name: BakwanJagungg
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Fetch Profile Stats Cards
        run: |
          curl -s "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=BakwanJagungg&theme=radical" -o dist/stats.svg
          curl -s "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=BakwanJagungg&theme=radical" -o dist/top-langs.svg

      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

